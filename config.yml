recipe: default.v1
language: fr

pipeline:
  - name: WhitespaceTokenizer          # découpe en mots
  - name: RegexFeaturizer              # repère des motifs (emails, etc.)
  - name: LexicalSyntacticFeaturizer   # features sur la forme des mots
  - name: CountVectorsFeaturizer       # transforme les mots en vecteurs
  - name: CountVectorsFeaturizer       # même chose au niveau des caractères,
    analyzer: char_wb                  # utile contre les fautes de frappe
    min_ngram: 1
    max_ngram: 4
  - name: DIETClassifier               # le modèle : intentions + entités
    epochs: 100
  - name: EntitySynonymMapper
  - name: ResponseSelector
    epochs: 100
  - name: FallbackClassifier           # si confiance trop basse → nlu_fallback
    threshold: 0.5
    ambiguity_threshold: 0.1

policies:
  - name: MemoizationPolicy            # retient les stories vues à l'identique
  - name: RulePolicy                   # applique les rules
  - name: UnexpecTEDIntentPolicy
    max_history: 5
    epochs: 100
  - name: TEDPolicy                    # modèle neuronal qui généralise
    max_history: 5
    epochs: 100
    constrain_similarities: true
assistant_id: pad-chatbot