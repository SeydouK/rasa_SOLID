    - suivi de navire 
    - état d'un navire 
    - je cherche des informations sur un navire 
    - quand arrive mon bateau ? 
    - suivre mon bateau 
    - position d'un navire 

- intent: ask_recrutement 
  examples: |
    - comment postuler chez vous ? 
    - est-ce que vous recrutez ?
    - offres d'emploi
    - je cherche un stage 
    - recrutement 
    - comment travailler au port ?
    - envoyer ma candidature 
    - y-a-t-il des psotes disponibles ?

- intent: ask_documentation
