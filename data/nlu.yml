version: "3.1"

nlu:
- intent: greet
  examples: |
    - bonjour
    - salut
    - bonsoir
    - coucou
    - hello
    - bonjour, j'ai une question

- intent: goodbye
  examples: |
    - au revoir
    - à bientôt
    - bye
    - bonne journée
    - à la prochaine

- intent: thank
  examples: |
    - merci
    - merci beaucoup
    - c'est gentil, merci
    - super, merci

- intent: ask_horaires
  examples: |
    - quels sont vos horaires ?
    - vous êtes ouverts quand ?
    - à quelle heure ouvrez-vous ?
    - horaires d'ouverture
    - jusqu'à quelle heure êtes-vous ouverts ?
    - est-ce que vous ouvrez le [samedi](jour) ?
    - quels sont vos horaires du [lundi](jour) ?
    - vous êtes ouverts le [dimanche](jour) ?
    - horaires du [mardi](jour)
    - à quelle heure vous fermez le [vendredi](jour) ?
    - ouverts [mercredi](jour) ?
    - et le [jeudi](jour) ?

- intent: inform_jour 
  examples: |
    - et le [lundi](jour) ?
    - le [samedi](jour) ?
    - [mardi](jour)
    - plutôt le [vendredi](jour) ?
    - et [dimanche](jour)?
    - le [mercredi](jour) alors ?

- intent: ask_contact
  examples: |
    - comment vous contacter ?
    - quel est votre numéro de téléphone ?
    - donnez-moi votre adresse email
    - je voudrais vous joindre
    - contact

- intent: ask_visite_virtuelle
  examples: |
    - c'est quoi la visite virtuelle ?
    - comment accéder à la visite 360 ?
    - je veux visiter en ligne
    - y a-t-il une visite panoramique ?

- intent: bot_challenge
  examples: |
    - es-tu un robot ?
    - je parle à un humain ?
    - tu es une IA ?

- intent : request_rdv
  examples: |
    - je voudrais un rendez-vous
    - je souhaite prendre rendez-vous 
    - comment fixer un rendez-vous ? 
    - j'aimerais rencontrer quelqu'un 
    - prendre rendez-vous 
    - je veux planifier une visite 
    - est-il possible d'avoir un rendez-vous ? 
    - rendez-vous

- intent: stop 
  examples: |
    - annuler 
    - laisse tomber
    - stop 
    - je ne veux plus 
    - non finalement 
    - oublie ça
    - arrête

- intent: ask_presentation
  examples: |
    - c'est quoi le PAD ?
    - présentez-vous
    - qui êtes-vous ?
    - parlez-moi du port 
    - qu'est-ce que le port autonome ?
    - quelle est votre mission ? 
    - présentation du PAD
    - à quoi sert le port ?

- intent: ask_services
  examples: |
    - quels services proposez-vous ? 
    - quels sont vos services ? 
    - que faites-vous ?
    - donne-moi la liste de vos services
    - qu'est-ce que vous offrez ?
    - vous proposez quoi comme service ? 
    - quelles sont vos prestations ? 
    - vos services 
    - détail du service de [pilotage](service)
    - c'est quoi le [remorquage](service) ?
    - parlez-moi du [lamanage](service)
    - en quoi consite la [manutention](service) ?
    - expliquez-moi l'[entreposage](service)
    - que comprend le service de [pilotage](service) ?
    - je veux des infos sur le [remorquage](service) 

- intent: ask_documents
  examples: |
    - quels documents faut-il pour importer ?
